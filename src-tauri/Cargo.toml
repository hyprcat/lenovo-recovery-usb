[package]
name = "recovery-usb-maker"
version = "0.1.0"
description = "Make a Lenovo factory-recovery USB stick on macOS or Linux"
license = "MIT"
repository = "https://github.com/hyprcat/lenovo-recovery-usb"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
flate2 = "1"
roxmltree = "0.21"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate", "aes-crypto"] }
nix = { version = "0.31", features = ["socket", "uio", "fs", "signal", "user"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 3 # hashing and unzipping 30 GB is unbearably slow unoptimized
